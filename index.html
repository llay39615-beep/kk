<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minty Heart - Interactive</title>
  
  <!-- 引入外部字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- 引入外部 CSS 文件 -->
  <link rel="stylesheet" href="style.css">

  <!-- p5.js 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <!-- p5.sound 音频库 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  <!-- ml5.js 手部追踪库 -->
  <script src="https://unpkg.com/ml5@1.2.1/dist/ml5.min.js"></script>
</head>
<body>
  
  <!-- 左上角标题 -->
  <div id="title">✦ Minty Heart</div>
  
  <!-- 屏幕中央的悬浮文字 -->
  <div id="center-text">
    <h2>Breathe & Pinch</h2>
    <p>Touch the beating heart</p >
  </div>
  
  <!-- 左下角的操作提示卡片 -->
  <div id="instructions">
    <div class="glass-card">
      <span>👉 PINCH: Deform</span><br>
      <span>✨ DRAG OUT: Spawn Hearts</span>
    </div>
  </div>

  <!-- 右下角调色盘 -->
  <div id="color-picker">
    <div class="color-btn active" data-theme="mint" style="background-color: #78ffb6;"></div>
    <div class="color-btn" data-theme="pink" style="background-color: #ff99cc;"></div>
    <div class="color-btn" data-theme="blue" style="background-color: #66ccff;"></div>
  </div>

  <!-- 开场的点击遮罩层 -->
  <div id="overlay">
    <h1>✦ Awaken the Heart ✦</h1>
    <p>Click anywhere to start</p >
  </div>

  <!-- 引入 p5.js 逻辑文件 -->
  <script src="sketch.js"></script>
</body>
</html>
